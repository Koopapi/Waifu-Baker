<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apertura de sobre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Dela+Gothic+One&display=swap">
<style>
/*
 * Apertura de sobre completa, como en el juego: el sobre (sobre-capas.js) se rasga o se despega,
 * las cartas (carta-capas.js) suben desde dentro, se pasan una por una y al final se ve el resumen.
 * Lee el registro del sobre de sobres/fa01.json; la tirada de cartas es de ejemplo (en el juego la decide el servidor).
 */
:root{--tinta:#17132B;--tinta-2:#211B3D;--indigo:#3B2FC9;--rosa:#FF3EA5;--lima:#C6F432;--turquesa:#3FE0D0;--trama:#FFD93D;--blanco:#FFFFFF;
  --f-titulo:"Dela Gothic One","Arial Black",system-ui,sans-serif;--f-texto:Archivo,"Arial Narrow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--tinta);color:var(--blanco);font:500 15px/1.5 var(--f-texto)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lima);outline-offset:3px}
.escena{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 28px;overflow:hidden;isolation:isolate;
  background:radial-gradient(60% 55% at 50% 46%,#3B2FC9 0%,#241D55 40%,#17132B 75%)}
.escena::before{content:"";position:absolute;left:50%;top:46%;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;pointer-events:none;z-index:-1;
  background:repeating-conic-gradient(rgba(255,62,165,.2) 0deg 7deg,transparent 7deg 18deg,rgba(198,244,50,.14) 18deg 23deg,transparent 23deg 34deg,rgba(63,224,208,.14) 34deg 39deg,transparent 39deg 50deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 28%,transparent 74%);mask-image:radial-gradient(closest-side,#000 28%,transparent 74%);animation:girar 70s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.barra{position:relative;z-index:6;width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.barra h1{margin:0;font:400 20px/1.1 var(--f-titulo);text-shadow:2px 2px 0 var(--rosa)}
.controles{display:flex;gap:8px}
.btn{border:3px solid var(--tinta);background:var(--blanco);color:var(--tinta);border-radius:8px;padding:8px 14px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em;font-size:13px;box-shadow:4px 4px 0 var(--rosa)}
.btn--rosa{background:var(--rosa);box-shadow:4px 4px 0 var(--tinta)}
.btn[aria-pressed=false]{opacity:.6}
.indicacion{position:relative;z-index:6;margin:0;background:var(--blanco);color:var(--tinta);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.04em;font-size:13px;padding:7px 16px;border:3px solid var(--tinta);border-radius:999px;box-shadow:4px 4px 0 var(--rosa);text-align:center;max-width:100%}
.indicacion.empuje{animation:empuje .45s}
@keyframes empuje{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.zona{position:relative;width:min(300px,68vw);container-type:inline-size;aspect-ratio:1000/1750;margin:18px 0 6px;flex:none}
.host{position:absolute;inset:0;z-index:3}
.host.fuera{pointer-events:none}
/* cartas: escondidas hasta abrir, todas derechas y solo se ve la de arriba */
.mazo{position:absolute;z-index:2;left:8cqw;top:28cqw;width:84cqw;aspect-ratio:700/991;touch-action:none}
.mazo.oculto{visibility:hidden}
.mazo.sube{transition:transform .75s cubic-bezier(.2,.8,.3,1)}
.mazo::before{content:"";position:absolute;inset:-18%;border-radius:50%;z-index:-1;opacity:0;background:radial-gradient(circle,rgba(247,220,138,.9),rgba(255,62,165,.35) 45%,transparent 70%);transition:opacity .6s}
.mazo.presagio::before{opacity:1;animation:latido 1.1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.12)}}
.carta-w{position:absolute;inset:0;transition:transform .4s cubic-bezier(.2,.8,.3,1),opacity .4s}
.carta-w.fuera{pointer-events:none}
.carta-w .cc{width:100%}
.rayo-ssr{position:absolute;inset:-60%;z-index:-1;pointer-events:none;opacity:0;background:repeating-conic-gradient(rgba(247,220,138,.85) 0 5deg,transparent 5deg 14deg);-webkit-mask:radial-gradient(circle,#000 15%,transparent 62%);mask:radial-gradient(circle,#000 15%,transparent 62%)}
.rayo-ssr.on{animation:rayos 2.6s ease-out forwards}
@keyframes rayos{0%{opacity:0;transform:scale(.4) rotate(0)}20%{opacity:1}100%{opacity:.55;transform:scale(1) rotate(40deg)}}
.estrella{position:absolute;z-index:30;right:-14px;top:-18px;pointer-events:none;display:grid;place-items:center;width:84px;height:84px;background:var(--lima);color:var(--tinta);font:400 20px var(--f-titulo);
  clip-path:polygon(99% 59.9%,68.2% 62.3%,77.6% 91.7%,54.2% 71.6%,40.1% 99%,37.7% 68.2%,8.3% 77.6%,28.4% 54.2%,1% 40.1%,31.8% 37.7%,22.4% 8.3%,45.8% 28.4%,59.9% 1%,62.3% 31.8%,91.7% 22.4%,71.6% 45.8%);
  transform:scale(0) rotate(-30deg);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.estrella.on{transform:scale(1) rotate(-12deg)}
.pie{position:relative;z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:60px}
.puntos{display:flex;gap:8px}
.puntos i{width:12px;height:12px;border-radius:50%;border:2px solid var(--blanco);transform:skewX(-10deg)}
.puntos i.ya{background:var(--lima);border-color:var(--lima)}
.puntos i.ahora{background:var(--rosa)}
.resumen{position:relative;z-index:6;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:18px;margin:auto 0}
.resumen h2{margin:0;font:400 clamp(26px,4vw,36px) var(--f-titulo);text-shadow:3px 3px 0 var(--rosa),6px 6px 0 var(--indigo)}
.rejilla{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:26px 18px;padding-top:12px}
.rejilla figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.rejilla .cc{width:100%}
.insignia{font-weight:900;font-style:italic;font-size:12px;letter-spacing:.1em;padding:2px 10px;border:2px solid var(--tinta);transform:skewX(-10deg);color:var(--tinta)}
.r-n{background:#D7D2E3}.r-r{background:var(--turquesa)}.r-sr{background:#8F86FF}.r-ssr{background:var(--lima);box-shadow:3px 3px 0 var(--rosa)}.r-ex{background:var(--rosa);color:#fff}
@media (prefers-reduced-motion:reduce){.escena::before,.mazo.presagio::before{animation:none}}
</style>
</head>
<body>
<main class="escena">
  <div class="barra">
    <h1>Waifu Baker</h1>
    <div class="controles">
      <button class="btn" id="btnSonido" type="button" aria-pressed="true">Sonido</button>
      <button class="btn" id="btnOtro" type="button">Reiniciar</button>
    </div>
  </div>
  <p class="indicacion" id="indicacion" aria-live="polite">Cargando el sobre…</p>
  <div class="zona" id="zona">
    <div class="mazo oculto" id="mazo"></div>
    <div class="host" id="host"></div>
  </div>
  <div class="resumen" id="resumen" hidden><h2>Tu sobre</h2><div class="rejilla" id="rejilla"></div></div>
  <div class="pie">
    <div class="puntos" id="puntos" hidden aria-hidden="true"></div>
    <button class="btn btn--rosa" id="btnAccion" type="button">Abrir sin deslizar</button>
  </div>
</main>

<script src="carta-capas.js"></script>
<script src="sobre-capas.js"></script>
<script>
(function () {
  var C = window.CartaCapas, S = window.SobreCapas;
  var $ = function (id) { return document.getElementById(id); };
  C.texturas.ondas = 'marcos/patrones/estelas.webp';
  var indicacion = $('indicacion'), mazo = $('mazo'), host = $('host'), btn = $('btnAccion'), puntos = $('puntos');
  var reducir = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sonido = true, estado = 'cargando', sobre = null, montadas = [], indice = 0, estaticas = [], timers = [];

  /* La tirada de ejemplo. En el juego la decide el servidor y llega con la configuración de cada carta (su JSON de carta-capas). */
  function tirada() {
    var ssr = { marco: 'ssr', capas: [
      { src: 'cartas/yuki/fondo.webp', profundidad: .2, margen: 5 },
      { particulas: 'destellos-dorados', cantidad: 60, semilla: 7, profundidad: .55, margen: 4 },
      { src: 'cartas/yuki/personaje.webp', profundidad: 1 },
      { src: 'cartas/yuki/efecto.webp', profundidad: 1.3, margen: 6, mezcla: 'overlay' },
      { src: 'cartas/yuki/insignia.webp', profundidad: 1.6 }
    ], sello: { src: 'cartas/yuki/ssr.webp', esquina: 'sup-izq' } };
    return [
      { nombre: 'Yuki', rareza: 'n', carta: C.desdeRareza('n', 'cartas/yuki/carta.webp') },
      { nombre: 'Yuki', rareza: 'r', carta: C.desdeRareza('r', 'cartas/yuki/carta.webp') },
      { nombre: 'Yuki', rareza: 'r', carta: C.desdeRareza('r', 'cartas/yuki/carta.webp') },
      { nombre: 'Yuki', rareza: 'sr', carta: C.desdeRareza('sr', 'cartas/yuki/carta.webp') },
      { nombre: 'Yuki', rareza: 'ssr', carta: ssr }
    ];
  }
  function especial(r) { return r === 'ssr' || r === 'ex' || r === 'ur' || r === 'px'; }
  var CARTAS = tirada();

  /* ---------- sonidos de la revelación (los del sobre los pone sobre-capas.js) ---------- */
  var ctx = null, ruido = null;
  function audio() {
    if (!sonido) return null;
    try {
      if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); ruido = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); var d = ruido.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }
  function zumbido() {
    var a = audio(); if (!a) return;
    var t = a.currentTime, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = ruido; f.type = 'highpass'; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(3200, t + .24);
    g.gain.setValueAtTime(.14, t); g.gain.exponentialRampToValueAtTime(.001, t + .24);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t, Math.random() * .5); s.stop(t + .26);
  }
  function campana() {
    var a = audio(); if (!a) return;
    [880, 1320, 1760, 2640].forEach(function (fr, i) {
      var t = a.currentTime + i * .07, o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = fr;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 1);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1.05);
    });
  }
  function vibrar(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  /* ---------- sobre ---------- */
  function montarSobre(registro) {
    sobre = S.montar(host, Object.assign({}, registro, {
      zona: document.querySelector('.escena'), sonido: sonido,
      alAbrir: alAbrir,
      alPista: function () { indicacion.classList.remove('empuje'); void indicacion.offsetWidth; indicacion.classList.add('empuje'); }
    }));
    estado = 'cerrado'; indicacion.textContent = sobre.textoIndicacion;
    prepararMazo();
  }

  /* ---------- cartas ---------- */
  function prepararMazo() {
    montadas.forEach(function (m) { m.api.destruir(); });
    montadas = [];
    mazo.innerHTML = '<div class="rayo-ssr" id="rayo"></div><div class="estrella" id="estrella" aria-hidden="true">SSR</div>';
    for (var i = CARTAS.length - 1; i >= 0; i--) {
      var w = document.createElement('div'); w.className = 'carta-w'; w.style.zIndex = 10 + CARTAS.length - i;
      var el = document.createElement('div'); w.appendChild(el); mazo.appendChild(w);
      var c = CARTAS[i];
      var api = C.montar(el, Object.assign({}, c.carta, { etiqueta: c.nombre + ', rareza ' + c.rareza.toUpperCase(), zona: mazo, reposo: true, aparecer: false }));
      api.ocultarSello();
      montadas[i] = { w: w, api: api, c: c };
    }
    acomodar();
  }
  function acomodar() {
    montadas.forEach(function (m, i) { if (i >= indice) { m.w.style.transform = ''; m.w.style.visibility = i === indice ? '' : 'hidden'; } });
  }
  function despues(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function alAbrir() {
    if (estado !== 'cerrado') return;
    estado = 'abriendo'; indicacion.textContent = '¡Abierto!'; btn.hidden = true;
    mazo.classList.remove('oculto');
    var t1 = reducir ? 0 : 380, t2 = reducir ? 150 : 1250, t3 = reducir ? 300 : 1900;
    despues(t1, function () { mazo.classList.add('sube'); mazo.style.transform = 'translateY(-52%)'; zumbido(); });
    despues(t2, function () { sobre.ocultar(); host.classList.add('fuera'); mazo.style.transform = 'translateY(0) scale(1.08)'; });
    despues(t3, function () { estado = 'revelando'; indice = 0; btn.hidden = false; btn.textContent = 'Siguiente carta'; puntos.hidden = false; tope(); });
  }
  function tope() {
    var m = montadas[indice], esp = especial(m.c.rareza);
    pintarPuntos(); acomodar();
    mazo.classList.remove('presagio');
    if (esp) {
      var r = $('rayo'); r.classList.remove('on'); void r.offsetWidth; r.classList.add('on');
      $('estrella').textContent = m.c.rareza.toUpperCase(); $('estrella').classList.add('on'); campana(); vibrar([30, 50, 80]);
    }
    m.api.entrar();
    indicacion.textContent = (esp ? '¡' : '') + m.c.nombre + ' · ' + m.c.rareza.toUpperCase() + (esp ? '!' : '') + ' · ' + (indice + 1) + ' de ' + CARTAS.length;
    var sig = montadas[indice + 1];
    if (sig && especial(sig.c.rareza)) mazo.classList.add('presagio');   // la siguiente es especial: el mazo late
  }
  function pintarPuntos() {
    var h = ''; for (var i = 0; i < CARTAS.length; i++) h += '<i class="' + (i < indice ? 'ya' : i === indice ? 'ahora' : '') + '"></i>';
    puntos.innerHTML = h;
  }
  function despachar(dir) {
    if (estado !== 'revelando') return;
    var m = montadas[indice];
    m.w.classList.add('fuera');
    m.w.style.transition = reducir ? 'opacity .2s' : '';
    m.w.style.transform = reducir ? '' : 'translateX(' + (dir * 150) + '%) rotate(' + (dir * 20) + 'deg)';
    m.w.style.opacity = '0';
    $('estrella').classList.remove('on'); $('rayo').classList.remove('on');
    zumbido(); indice++;
    if (indice >= CARTAS.length) { estado = 'resumen'; despues(reducir ? 100 : 350, mostrarResumen); }
    else tope();
  }
  // deslizar la carta de arriba hacia un lado; un toque la pasa
  var arr = null;
  mazo.addEventListener('pointerdown', function (ev) {
    if (estado !== 'revelando') return;
    var m = montadas[indice]; if (!m || !m.w.contains(ev.target)) return;
    arr = { x: ev.clientX, t: performance.now(), dx: 0, m: m }; m.w.style.transition = 'none';
  });
  mazo.addEventListener('pointermove', function (ev) {
    if (!arr) return;
    arr.dx = ev.clientX - arr.x;
    arr.m.w.style.transform = 'translateX(' + arr.dx + 'px) rotate(' + (arr.dx * .05) + 'deg)';
  });
  function finArrastre() {
    if (!arr) return;
    var a = arr; arr = null; a.m.w.style.transition = '';
    if (Math.abs(a.dx) > 70) despachar(a.dx > 0 ? 1 : -1);
    else if (Math.abs(a.dx) < 6 && performance.now() - a.t < 300) despachar(1);
    else a.m.w.style.transform = '';
  }
  mazo.addEventListener('pointerup', finArrastre);
  mazo.addEventListener('pointercancel', finArrastre);

  /* ---------- resumen ---------- */
  function mostrarResumen() {
    $('zona').hidden = true; puntos.hidden = true; $('resumen').hidden = false;
    indicacion.textContent = CARTAS.length + ' cartas nuevas';
    btn.textContent = 'Abrir otro sobre';
    var rej = $('rejilla'); rej.innerHTML = '';
    estaticas = CARTAS.map(function (c) {
      var f = document.createElement('figure'), el = document.createElement('div'), cap = document.createElement('figcaption');
      cap.className = 'insignia r-' + c.rareza; cap.textContent = c.rareza.toUpperCase();
      f.appendChild(el); f.appendChild(cap); rej.appendChild(f);
      return C.montar(el, Object.assign({}, c.carta, { estatica: true, etiqueta: c.nombre + ', rareza ' + c.rareza.toUpperCase() }));
    });
  }

  /* ---------- reiniciar ---------- */
  function reiniciar() {
    timers.forEach(clearTimeout); timers = [];
    estaticas.forEach(function (a) { a.destruir(); }); estaticas = [];
    $('resumen').hidden = true; $('zona').hidden = false; puntos.hidden = true;
    mazo.classList.remove('sube', 'presagio'); mazo.classList.add('oculto'); mazo.style.transform = '';
    host.classList.remove('fuera');
    btn.hidden = false; btn.textContent = 'Abrir sin deslizar';
    indice = 0; estado = 'cerrado';
    sobre.reiniciar(); indicacion.textContent = sobre.textoIndicacion;
    prepararMazo();
  }

  btn.addEventListener('click', function () {
    if (estado === 'cerrado') sobre.abrir();
    else if (estado === 'revelando') despachar(1);
    else if (estado === 'resumen') reiniciar();
  });
  $('btnOtro').addEventListener('click', function () { if (sobre) reiniciar(); });
  $('btnSonido').addEventListener('click', function () {
    sonido = !sonido; this.setAttribute('aria-pressed', String(sonido));
    if (sobre) sobre.opciones.sonido = sonido;
  });

  // El registro del sobre: el mismo JSON que exporta el creador de sobres.
  fetch('sobres/fa01.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(montarSobre)
    .catch(function () { indicacion.textContent = 'No se pudo leer sobres/fa01.json. Abre esta página desde un servidor (no con doble clic).'; });
})();
</script>
</body>
</html>
