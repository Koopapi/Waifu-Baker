<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waifu Baker · Carta revelada (street pop)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;family=Dela+Gothic+One&amp;display=swap">
<style>
body{margin:0;background:#17132B;color:#FFFFFF;font-family:Archivo,"Arial Narrow",system-ui,sans-serif}
a{color:#C6F432}a:hover{color:#FFFFFF}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1) rotate(25deg)}}
@keyframes b-bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(-8deg)}}
@keyframes b-wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(-4deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.b-anim{animation:none!important}}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(60% 55% at 50% 46%, #3B2FC9 0%, #241D55 38%, #17132B 72%); display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 26px 16px 40px">

  <!-- rayos y trama -->
  <div class="b-anim" aria-hidden="true" style="position: absolute; left: 50%; top: 46%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,62,165,.22) 0deg 7deg, transparent 7deg 18deg, rgba(198,244,50,.16) 18deg 23deg, transparent 23deg 34deg, rgba(63,224,208,.16) 34deg 39deg, transparent 39deg 50deg); mask-image: radial-gradient(closest-side, #000 28%, transparent 74%); -webkit-mask-image: radial-gradient(closest-side, #000 28%, transparent 74%); animation: b-spin 70s linear infinite"></div>
  <div aria-hidden="true" style="position: absolute; left: -60px; bottom: -60px; width: 340px; height: 340px; border-radius: 50%; background-image: radial-gradient(#FFD93D 30%, transparent 32%); background-size: 16px 16px; opacity: .55"></div>
  <div aria-hidden="true" style="position: absolute; right: -40px; top: 90px; width: 240px; height: 240px; border-radius: 50%; background-image: radial-gradient(#3FE0D0 30%, transparent 32%); background-size: 14px 14px; opacity: .45"></div>

  <!-- barra -->
  <header style="position: relative; width: 100%; max-width: 1200px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
    <a href="b-coleccion.html" style="text-decoration: none; color: #17132B; background: #FFFFFF; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .05em; font-size: 14px; padding: 9px 16px; border: 3px solid #17132B; border-radius: 8px; box-shadow: 4px 4px 0 #FF3EA5">← Mis sobres</a>
    <span style="background: #17132B; color: #FFFFFF; border: 2px solid #FFFFFF; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; padding: 7px 14px; transform: skewX(-12deg)">Sobre de Expedición · Vol. 1</span>
    <span style="font-family: 'Dela Gothic One', system-ui, sans-serif; font-size: 16px; color: #17132B; background: #C6F432; border: 3px solid #17132B; padding: 4px 14px; transform: skewX(-10deg); box-shadow: 4px 4px 0 #FF3EA5">1 / 5</span>
  </header>

  <!-- título -->
  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <span style="background: #C6F432; color: #17132B; font-weight: 900; font-style: italic; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; padding: 7px 18px; border: 3px solid #17132B; transform: skewX(-12deg) rotate(-2deg); box-shadow: 5px 5px 0 #FF3EA5">¡Nueva en tu colección!</span>
    <h1 style="margin: 0; font-family: 'Dela Gothic One', system-ui, sans-serif; font-weight: 400; font-size: clamp(56px, 8vw, 96px); line-height: 1; color: #FFFFFF; text-shadow: 5px 5px 0 #FF3EA5, 10px 10px 0 #3FE0D0; transform: skewY(-3deg)">YUKI</h1>
  </div>

  <!-- carta -->
  <div style="position: relative; width: min(340px, 74vw); margin-top: 8px">
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 620px; height: 620px; margin: -310px 0 0 -310px; background: #C6F432; opacity: .9; clip-path: polygon(99.8% 55.0%, 81.8% 62.0%, 84.9% 75.1%, 71.5% 76.3%, 69.3% 92.8%, 55.5% 83.6%, 45.0% 99.8%, 38.0% 81.8%, 23.7% 86.5%, 23.7% 71.5%, 4.4% 70.6%, 16.4% 55.5%, 7.2% 45.7%, 18.2% 38.0%, 11.8% 22.6%, 28.5% 23.7%, 29.4% 4.4%, 44.5% 16.4%, 54.5% 5.2%, 62.0% 18.2%, 79.2% 9.4%, 76.3% 28.5%, 89.2% 32.3%, 83.6% 44.5%)"></div>
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -250px; background: #FF3EA5; clip-path: polygon(99.0% 59.9%, 68.2% 62.3%, 77.6% 91.7%, 54.2% 71.6%, 40.1% 99.0%, 37.7% 68.2%, 8.3% 77.6%, 28.4% 54.2%, 1.0% 40.1%, 31.8% 37.7%, 22.4% 8.3%, 45.8% 28.4%, 59.9% 1.0%, 62.3% 31.8%, 91.7% 22.4%, 71.6% 45.8%)"></div>
    <div aria-hidden="true" style="position: absolute; inset: 12px -22px -10px 22px; border: 4px solid #17132B; border-radius: 14px; background: #3B2FC9; transform: rotate(7deg)"></div>
    <div aria-hidden="true" style="position: absolute; inset: 8px -12px -6px 12px; border: 4px solid #17132B; border-radius: 14px; background: #3FE0D0; transform: rotate(3.5deg)"></div>
    <div role="img" aria-label="Yuki, carta SSR" style="position: relative; aspect-ratio: 700 / 991; border: 4px solid #FFFFFF; border-radius: 14px; overflow: visible; box-shadow: 0 0 0 4px #17132B, 12px 12px 0 4px #17132B, 0 0 90px rgba(255,62,165,.55); transform: rotate(-2deg); background: #17132B">
      <img src="assets/yuki_carta.webp" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 10px">
      <img class="b-anim" src="assets/yuki_ssr.webp" alt="" style="position: absolute; left: -48px; top: -36px; width: 142px; filter: drop-shadow(4px 4px 0 #17132B) drop-shadow(0 8px 10px rgba(0,0,0,.45)); animation: b-bob 3.4s ease-in-out infinite">
    </div>

    <!-- sticker -->
    <div class="b-anim" style="position: absolute; top: -30px; right: -78px; display: grid; place-items: center; width: 132px; height: 132px; background: #FFFFFF; clip-path: polygon(99.0% 59.9%, 68.2% 62.3%, 77.6% 91.7%, 54.2% 71.6%, 40.1% 99.0%, 37.7% 68.2%, 8.3% 77.6%, 28.4% 54.2%, 1.0% 40.1%, 31.8% 37.7%, 22.4% 8.3%, 45.8% 28.4%, 59.9% 1.0%, 62.3% 31.8%, 91.7% 22.4%, 71.6% 45.8%); animation: b-wob 2.6s ease-in-out infinite">
      <span style="text-align: center; line-height: 1; color: #17132B"><b style="display: block; font-family: 'Dela Gothic One', system-ui, sans-serif; font-size: 15px">¡NUEVA!</b><b style="font-size: 9.5px; font-style: italic; letter-spacing: .12em">1.ª COPIA</b></span>
    </div>

    <svg class="b-anim" aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; bottom: 70px; left: -60px; width: 38px; height: 38px; animation: b-tw 2.4s ease-in-out infinite"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" fill="#FFD93D" stroke="#17132B" stroke-width="1"/></svg>
    <svg class="b-anim" aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; bottom: -22px; right: -30px; width: 30px; height: 30px; animation: b-tw 2s ease-in-out .8s infinite"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" fill="#3FE0D0" stroke="#17132B" stroke-width="1"/></svg>
  </div>

  <!-- datos -->
  <div style="position: relative; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px">
    <span style="font-family: 'Dela Gothic One', system-ui, sans-serif; font-size: 16px; color: #17132B; padding: 3px 14px; background: #C6F432; border: 3px solid #17132B; transform: skewX(-10deg); box-shadow: 4px 4px 0 #FF3EA5">SSR</span>
    <span style="background: #FFFFFF; color: #17132B; border: 3px solid #17132B; border-radius: 8px; padding: 4px 12px; box-shadow: 4px 4px 0 #3B2FC9"><span style="font-size: 10px; font-weight: 900; letter-spacing: .18em; color: #3B2FC9">TERRENO </span><b style="font-style: italic">Ciudad · Costa</b></span>
    <span style="background: #FFFFFF; color: #17132B; border: 3px solid #17132B; border-radius: 8px; padding: 4px 12px; box-shadow: 4px 4px 0 #3FE0D0"><span style="font-size: 10px; font-weight: 900; letter-spacing: .18em; color: #3B2FC9">ROL </span><b style="font-style: italic">Guardiana</b></span>
  </div>

  <!-- acciones -->
  <div style="position: relative; display: flex; flex-wrap: wrap; gap: 16px; justify-content: center">
    <button type="button" style="font: inherit; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .04em; font-size: 17px; padding: 15px 28px; background: #FF3EA5; color: #17132B; border: 3px solid #FFFFFF; border-radius: 8px; box-shadow: 6px 6px 0 #C6F432; cursor: pointer">Siguiente carta</button>
    <button type="button" style="font: inherit; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .04em; font-size: 17px; padding: 15px 24px; background: transparent; color: #FFFFFF; border: 3px solid #FFFFFF; border-radius: 8px; cursor: pointer">Revelar las 4 restantes</button>
  </div>
</div>
</body>
</html>
