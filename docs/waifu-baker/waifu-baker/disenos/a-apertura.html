<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waifu Baker · Carta revelada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=M+PLUS+Rounded+1c:wght@400;500;700;800&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0F0C14;color:#FFF7FB;font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
a{color:#A6F0E6}a:hover{color:#FFE66B}
@keyframes wb-spin{to{transform:rotate(360deg)}}
@keyframes wb-tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1) rotate(25deg)}}
@keyframes wb-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.wb-anim{animation:none!important}}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(60% 55% at 50% 45%, #3A1A3A 0%, #0F0C14 70%); display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 28px 16px 36px">

  <!-- rayos -->
  <div class="wb-anim" aria-hidden="true" style="position: absolute; left: 50%; top: 45%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,111,184,.16) 0deg 8deg, transparent 8deg 22deg, rgba(166,240,230,.12) 22deg 28deg, transparent 28deg 45deg); mask-image: radial-gradient(closest-side, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent 75%); animation: wb-spin 60s linear infinite"></div>

  <header style="position: relative; width: 100%; max-width: 1200px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
    <a href="a-coleccion.html" style="text-decoration: none; font-weight: 800; color: #FFF7FB; background: rgba(26,22,34,.85); border: 2px solid #3A3147; border-radius: 999px; padding: 9px 16px">← Mis sobres</a>
    <span style="font-weight: 700; color: #CFC6DA">Sobre de Expedición · Vol. 1</span>
    <span style="font-family: Unbounded, system-ui, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FFF7FB; background: rgba(26,22,34,.85); border: 2px solid #3A3147; border-radius: 999px; padding: 8px 14px">1 / 5</span>
  </header>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <p style="margin: 0; font-family: Unbounded, system-ui, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .34em; color: #FFE66B">¡NUEVA EN TU COLECCIÓN!</p>
    <h1 style="margin: 0; font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; font-size: clamp(44px, 6vw, 72px); line-height: 1; color: #FF6FB8; text-shadow: 4px 4px 0 #FFE66B, 8px 8px 0 #2A1F35">Yuki</h1>
  </div>

  <!-- carta -->
  <div style="position: relative; width: min(340px, 78vw)">
    <div aria-hidden="true" style="position: absolute; inset: 14px -26px -10px 26px; border-radius: 22px; background: linear-gradient(150deg, #C8A8FF, #FF9AD5 55%, #FFC7A6); transform: rotate(7deg); opacity: .55"></div>
    <div aria-hidden="true" style="position: absolute; inset: 10px -14px -6px 14px; border-radius: 22px; background: linear-gradient(150deg, #A6F0E6, #86F07C 60%, #FFE66B); transform: rotate(3.5deg); opacity: .7"></div>
    <div role="img" aria-label="Yuki, carta SSR" style="position: relative; aspect-ratio: 700 / 991; border-radius: 22px; padding: 8px; background: linear-gradient(120deg, #FF9AD5, #FFC7A6 28%, #FFE66B 48%, #A6F0E6 70%, #C8A8FF); box-shadow: 0 0 0 3px #0F0C14, 0 30px 70px rgba(0,0,0,.65), 0 0 110px rgba(255,111,184,.45)">
      <img src="assets/yuki_carta.webp" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 15px">
      <img class="wb-anim" src="assets/yuki_ssr.webp" alt="" style="position: absolute; left: -44px; top: -32px; width: 140px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.5)); animation: wb-bob 3.4s ease-in-out infinite">
    </div>
    <svg class="wb-anim" aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; top: 20px; right: -48px; width: 40px; height: 40px; animation: wb-tw 2.4s ease-in-out infinite"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" fill="#FFE66B"/></svg>
    <svg class="wb-anim" aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; bottom: 60px; left: -56px; width: 34px; height: 34px; animation: wb-tw 3s ease-in-out .5s infinite"><path d="M12 1l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.1 5.6 20.6 7 13.5 1.7 8.5l7.2-.9z" fill="#86F07C" stroke="#FFF7FB" stroke-width="1.2"/></svg>
    <svg class="wb-anim" aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; bottom: -18px; right: -20px; width: 26px; height: 26px; animation: wb-tw 2s ease-in-out 1s infinite"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" fill="#A6F0E6"/></svg>
  </div>

  <div style="position: relative; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
    <span style="font-family: Unbounded, system-ui, sans-serif; font-weight: 700; font-size: 13px; padding: 5px 11px; border-radius: 8px; background: linear-gradient(120deg, #FF9AD5, #FFE66B 50%, #A6F0E6); color: #1A0F18">SSR</span>
    <span style="font-weight: 700; font-size: 14px; padding: 5px 12px; border-radius: 999px; background: #1A1622; border: 2px solid #3A3147">Ciudad · Costa</span>
    <span style="font-weight: 700; font-size: 14px; padding: 5px 12px; border-radius: 999px; background: #1A1622; border: 2px solid #3A3147">Guardiana</span>
  </div>

  <div style="position: relative; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center">
    <button type="button" style="font: inherit; font-weight: 800; font-size: 17px; border: 0; border-radius: 999px; padding: 15px 28px; background: #FF6FB8; color: #1A0F18; box-shadow: 4px 4px 0 #FFE66B; cursor: pointer">Siguiente carta</button>
    <button type="button" style="font: inherit; font-weight: 800; font-size: 17px; border: 2px solid #A6F0E6; border-radius: 999px; padding: 13px 24px; background: transparent; color: #A6F0E6; cursor: pointer">Revelar las 4 restantes</button>
  </div>
</div>
</body>
</html>
