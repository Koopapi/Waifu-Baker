<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expediciones Waifu Baker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: pantalla de la app Waifu Baker. Mapa ilustrado a la izquierda, espacios de expedición a la derecha; en móvil se apilan con los espacios arriba. Tema oscuro único, como la app. */
:root{
  --rail:#140f17;--nav:#1c1520;--bg:#241b29;--raised:#2e2333;--hover:#3a2c40;--line:#41324a;
  --text:#f7f0f4;--text2:#c9b9c4;--text3:#9d8a98;--accent:#d6336c;--accent-text:#ff8ab0;
  --good:#5ce1a5;--warn:#ffc46b;--bad:#ff7b7b;--gold:#f2cf6e;
  --sea:#130d18;--land:#2a1f31;--land-edge:#4a3852;
  --f-head:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text)}
body{font:14.5px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;display:grid;gap:16px}

/* ---------- barra superior ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent);font:700 15px var(--f-head);color:#fff;flex:none}
h1{margin:0;font:700 22px/1.15 var(--f-head)}
.sub{margin:0;color:var(--text3);font-size:12.5px}
.res{display:flex;gap:8px;flex-wrap:wrap}
.res span{display:inline-flex;align-items:center;gap:7px;background:var(--nav);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;color:var(--text2)}
.res b{font:700 14px var(--f-head);color:var(--text);font-variant-numeric:tabular-nums}
.res svg{width:18px;height:18px;flex:none}
.res .bump{animation:bump .6s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.seg{display:inline-flex;background:var(--rail);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:var(--text2);font-weight:600;font-size:13px;padding:6px 12px;border-radius:6px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--text2);font-weight:600;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.demo-note{margin:0;font-size:12.5px;color:var(--text3)}
.demo-note b{color:var(--warn);font-weight:600}

/* ---------- mapa ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}.slots-col{order:-1}}
.map-card{background:var(--rail);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px;min-width:0}
.map{position:relative;aspect-ratio:1000/640;width:100%;border-radius:10px;overflow:hidden;background:var(--sea)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fog{transition:opacity 1.4s ease}
.fog.off{opacity:0}
.fog g{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(18px,-8px)}}
.route{transition:stroke .6s,opacity .6s}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text3);padding:0 4px 2px}
.map-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c);vertical-align:0}

.node{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:4px;border:0;background:none;padding:0;width:max-content;max-width:24%;z-index:2}
.node .med{position:relative;width:clamp(36px,6.4vw,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a2c40,#1c1520 70%);box-shadow:0 0 0 2px var(--tc),0 6px 18px rgba(0,0,0,.55);transition:transform .2s}
.node:hover .med{transform:scale(1.08)}
.node .med svg{width:46%;height:46%;color:var(--tc)}
.node .ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--accent-text) calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
.node .ready{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--rail);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--rail),0 0 0 8px rgba(92,225,165,.25)}}
.node .lbl{background:rgba(20,15,23,.86);border:1px solid var(--line);border-radius:8px;padding:3px 8px;text-align:center;line-height:1.25;backdrop-filter:blur(4px)}
.node .lbl b{display:block;font:600 clamp(10.5px,1.25vw,13px) var(--f-head);white-space:nowrap}
.node .lbl small{display:block;font-size:clamp(10px,1.05vw,11.5px);color:var(--text3);white-space:nowrap;font-variant-numeric:tabular-nums}
.node.locked .med{background:#2a2430;box-shadow:0 0 0 2px #5a4e60}
.node.locked .med svg{color:#8a7f90}
.node.locked .lbl b{color:var(--text2)}
.node.next .lbl small{color:var(--warn)}
@media (max-width:560px){.node .lbl small{display:none}.node .lbl{padding:2px 6px;max-width:92px}.node .lbl b{white-space:normal;font-size:10.5px;line-height:1.15}.node{max-width:none}}

/* ---------- espacios ---------- */
.slots-col{display:grid;gap:10px;min-width:0}
.slots-list{display:grid;gap:10px;min-width:0}
.slots-col h2{margin:0;font:700 17px var(--f-head);display:flex;justify-content:space-between;align-items:baseline}
.slots-col h2 small{font:500 13px var(--f-body);color:var(--text3)}
.slot{background:var(--nav);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.slot.done{border-color:var(--good);box-shadow:0 0 0 1px rgba(92,225,165,.25),0 0 24px rgba(92,225,165,.08)}
.slot.free{border-style:dashed;background:transparent;color:var(--text3);font-size:13.5px}
.slot.lockd{border-style:dashed;background:transparent;color:var(--text3);font-size:13px;display:flex;align-items:center;gap:10px}
.slot.lockd svg{width:18px;height:18px;flex:none}
.slot-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.slot-top b{font:600 14.5px var(--f-head)}
.slot-top span{font-size:12.5px;color:var(--text3);white-space:nowrap}
.avs{display:flex;align-items:center}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 13px var(--f-head);color:#1a1020;background:var(--ac,#999);box-shadow:0 0 0 2px var(--nav);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.avs .av+.av{margin-left:-8px}
.avs .names{margin-left:10px;font-size:13px;color:var(--text2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;border-radius:999px;background:var(--hover);overflow:hidden}
.prog i{display:block;height:100%;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,var(--accent),var(--accent-text));border-radius:inherit}
.slot.done .prog i{background:var(--good)}
.slot-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.time{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.slot.done .time{color:var(--good);font-family:var(--f-head)}
.btn{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;line-height:1.2}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:#0f2a1e}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inline-confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--text2);background:var(--raised);border-radius:8px;padding:8px}

/* ---------- diálogos ---------- */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--text);padding:0;width:min(980px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(12,8,14,.78)}
dialog.small{width:min(460px,calc(100% - 24px))}
.dlg{display:grid;gap:16px;padding:20px}
.dlg-h{display:flex;justify-content:space-between;align-items:start;gap:12px}
.dlg-h h2{margin:0;font:700 21px/1.2 var(--f-head);text-wrap:balance}
.dlg-h p{margin:4px 0 0;color:var(--text2);font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.x{border:0;background:transparent;color:var(--text2);font-size:24px;line-height:1;padding:4px 8px;border-radius:6px;flex:none}
.x:hover{background:var(--raised)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--raised);color:var(--text2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.eyebrow{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}

/* preparar */
.prep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
@media (max-width:820px){.prep{grid-template-columns:minmax(0,1fr)}}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tslot{position:relative;aspect-ratio:3/4;border-radius:12px;border:1.5px dashed var(--line);background:var(--rail);display:grid;place-items:center;color:var(--text3);font-size:12.5px;text-align:center;padding:6px;overflow:hidden}
.tslot.filled{border:0;padding:0;cursor:pointer}
.tslot.filled .art{position:absolute;inset:0}
.tslot .cap{position:absolute;inset:auto 0 0;padding:18px 8px 7px;background:linear-gradient(transparent,rgba(12,8,14,.92));text-align:left}
.tslot .cap b{display:block;font:600 13.5px var(--f-head);color:var(--text)}
.tslot .cap small{display:block;font-size:11.5px;color:var(--text2)}
.tslot .rm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(12,8,14,.75);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1}
.meter{display:grid;gap:6px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meter-top b{font:700 20px var(--f-head);font-variant-numeric:tabular-nums}
.meter-top b small{font:500 13px var(--f-body);color:var(--text3)}
.calif{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:700;font-size:13px;font-family:var(--f-head);color:#1a1020;background:var(--cc)}
.c-excelente{--cc:var(--gold)}.c-bien{--cc:var(--good)}.c-normal{--cc:var(--warn)}.c-dificil{--cc:var(--bad)}
.track{position:relative;height:12px;border-radius:999px;background:var(--hover)}
.track .fill{position:absolute;inset:0 auto 0 0;width:calc(var(--f,0)*100%);border-radius:inherit;background:var(--cc,var(--text3));transition:width .35s ease,background .35s}
.track .tk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bg);left:calc(var(--x)*100%)}
.track-lbl{position:relative;height:16px;font-size:11px;color:var(--text3)}
.track-lbl span{position:absolute;transform:translateX(-50%);left:calc(var(--x)*100%);white-space:nowrap}
.syn{display:flex;flex-wrap:wrap;gap:6px}
.syn span{font-size:12px;border-radius:999px;padding:2px 10px;background:rgba(92,225,165,.12);color:var(--good);font-weight:600}
.syn span.off{background:var(--raised);color:var(--text3);font-weight:500}
.durs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dur{border:1px solid var(--line);background:var(--rail);border-radius:10px;padding:9px 10px;text-align:left;display:grid;gap:2px}
.dur b{font:700 15px var(--f-head)}
.dur small{font-size:11.5px;color:var(--text3);line-height:1.35}
.dur[aria-pressed=true]{border-color:var(--accent-text);background:var(--raised)}
.expect{margin:0;font-size:13px;color:var(--text2);background:var(--nav);border-radius:10px;padding:10px 12px}
.expect b{color:var(--text);font-variant-numeric:tabular-nums}
.sendrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sendrow .why{font-size:12.5px;color:var(--warn)}
details.odds summary{cursor:pointer;color:var(--accent-text);font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--text3);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.picker-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.picker-h h3{margin:0;font:700 15px var(--f-head)}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--rail);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:5px}
.filters button i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.filters button[aria-pressed=true]{background:var(--raised);border-color:var(--accent-text);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;max-height:min(520px,52vh);overflow:auto;padding:2px 4px 4px 2px}
@media (max-width:820px){.grid{max-height:none}}
.ct{position:relative;border:1px solid var(--line);background:var(--nav);border-radius:12px;padding:0;overflow:hidden;text-align:left;display:grid;grid-template-rows:auto 1fr}
.ct:hover{border-color:var(--text3)}
.ct.sel{border-color:var(--accent-text);box-shadow:0 0 0 1px var(--accent-text)}
.ct.na{opacity:.45;cursor:not-allowed}
.ct .art{aspect-ratio:4/3.4;position:relative}
.ct .rb{position:absolute;top:6px;left:6px}
.ct .chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.ct .bd{padding:7px 9px 9px;display:grid;gap:1px}
.ct .bd b{font:600 13.5px var(--f-head);display:flex;justify-content:space-between;gap:6px}
.ct .bd b span{font:700 13.5px var(--f-mono);color:var(--accent-text)}
.ct .bd b span.on{color:var(--good)}
.ct .bd small{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .busy{position:absolute;inset:0 0 auto;padding:6px;font-size:11.5px;font-weight:600;color:var(--text);background:rgba(12,8,14,.8);text-align:center}
.rb{display:inline-block;font:700 10.5px/1 var(--f-head);letter-spacing:.04em;padding:3px 6px;border-radius:5px;color:#1a1020;background:var(--rc)}
.r-N{--rc:#c6ccd6}.r-R{--rc:#7fb2ff}.r-SR{--rc:#c3a0ff}.r-SSR{--rc:linear-gradient(135deg,#f7dc8a,#c3861c 60%,#fbe39a)}.r-UR{--rc:linear-gradient(135deg,#ffb3d1,#ffe08a,#9ff2cf,#8fd2ff,#d3b0ff)}

/* arte de ejemplo */
.art{display:block;position:relative;background:var(--ph,#333);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;display:block}
.art.ph{background:radial-gradient(120% 90% at 30% 10%,color-mix(in srgb,var(--tc) 70%,#fff 10%) 0%,color-mix(in srgb,var(--tc) 35%,#241b29) 45%,#1c1520 100%);display:grid;place-items:center}
.art.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 6px,transparent 6px 14px)}
.art.ph span{position:relative;font:700 clamp(28px,5vw,44px)/1 var(--f-head);color:rgba(255,255,255,.88);text-shadow:0 4px 18px rgba(0,0,0,.35)}
.art.holo::after{content:"";position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:.35;background:repeating-linear-gradient(115deg,#ff7aa8 0%,#ffd36e 7%,#8af0c4 14%,#6ec8ff 21%,#c79bff 28%,#ff7aa8 35%);background-size:250% 250%;animation:holo 6s linear infinite}
@keyframes holo{to{background-position:250% 0}}

/* reporte */
.rep{display:grid;gap:16px}
.rep-head{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}
.evs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.evs li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:baseline;background:var(--nav);border-radius:10px;padding:10px 12px;opacity:0;transform:translateY(6px);animation:in .45s ease forwards;animation-delay:calc(var(--i)*.55s + .2s)}
.evs li i{width:10px;height:10px;border-radius:50%;background:var(--ec);align-self:center}
.e-escena{--ec:var(--text3)}.e-bueno{--ec:var(--good)}.e-malo{--ec:var(--bad)}.e-encuentro{--ec:var(--gold)}
.evs li p{margin:0}
.evs li span{font-size:12px;font-weight:700;white-space:nowrap;color:var(--ec)}
@keyframes in{to{opacity:1;transform:none}}
.loot{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.lt{background:var(--nav);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;opacity:0;animation:in .45s ease forwards;animation-delay:var(--d)}
.lt svg{width:30px;height:30px;flex:none}
.lt b{display:block;font:700 20px var(--f-head);font-variant-numeric:tabular-nums}
.lt small{color:var(--text3);font-size:12px}
.lt.zero{opacity:0;animation-name:in-dim}
@keyframes in-dim{to{opacity:.45}}
.bonds{display:grid;gap:10px;opacity:0;animation:in .45s ease forwards;animation-delay:var(--d)}
.bond{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.bond-t{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.bond-t b{font-family:var(--f-head)}
.bond-t span{color:var(--text3);font-variant-numeric:tabular-nums}
.xp{height:8px;border-radius:999px;background:var(--hover);overflow:hidden;margin-top:4px}
.xp i{display:block;height:100%;width:calc(var(--w,0)*100%);background:linear-gradient(90deg,#ff8ab0,#ffc2d6);border-radius:inherit;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.lvlup{margin:4px 0 0;font-size:12.5px;color:var(--gold);font-weight:600}
.reveal{display:grid;justify-items:center;gap:10px;opacity:0;animation:in .45s ease forwards;animation-delay:var(--d)}
.reveal p{margin:0;font-size:13px;color:var(--text2);text-align:center}
.flip{width:170px;aspect-ratio:700/991;perspective:900px;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.25,.5,1)}
.flip.on .in{transform:rotateY(180deg)}
.flip .fc{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.flip .bk{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px),linear-gradient(150deg,#6b3fd1,#3a1f7a 60%,#24124f);border:2px solid #7e55e0;display:grid;place-items:center;font:700 22px var(--f-head);color:#e9ddff;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 34px rgba(170,140,255,.55)}}
.flip .fr{transform:rotateY(180deg);border:3px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--rc) border-box}
.flip .fr .art{position:absolute;inset:0}
.flip .fr .cap{position:absolute;inset:auto 0 0;padding:20px 10px 9px;background:linear-gradient(transparent,rgba(12,8,14,.92));text-align:left}
.flip .fr .cap b{display:block;font:700 15px var(--f-head)}
.flip .fr .cap small{font-size:11.5px;color:var(--text2)}

/* personajes */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pc{background:var(--nav);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.pc-h{display:flex;gap:12px;align-items:center}
.pc-h .av{width:52px;height:52px;font-size:20px;box-shadow:none}
.pc-h h3{margin:0;font:700 17px var(--f-head)}
.pc-h p{margin:2px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.lv{margin-left:auto;text-align:center;line-height:1}
.lv b{display:block;font:700 26px var(--f-head);color:var(--accent-text)}
.lv small{font-size:10.5px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.pc .meta{font-size:12.5px;color:var(--text3);display:flex;justify-content:space-between;gap:8px}
.pc .next{margin:0;font-size:12.5px;color:var(--text2)}
.pc ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pc li{font-size:12px;background:var(--raised);border-radius:6px;padding:2px 8px;color:var(--text2);display:inline-flex;gap:6px;align-items:center}
.pc li .rb{font-size:9.5px;padding:2px 5px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--text3);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 16px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.45);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .fog g,.node .ready,.art.holo::after,.flip .bk{animation:none}
  .evs li,.lt,.bonds,.reveal{animation-duration:.01s;animation-delay:0s!important}
  .xp i,.flip .in{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand"><div class="logo">WB</div><div><h1>Expediciones</h1><p class="sub">Prototipo funcional · Waifu Baker</p></div></div>
    <div class="res" aria-label="Tus recursos">
      <span title="Galletas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#d9a066"/><circle cx="12" cy="12" r="9.5" fill="none" stroke="#a8703c" stroke-width="1.5"/><circle cx="8.5" cy="9" r="1.5" fill="#5a3518"/><circle cx="14.5" cy="8" r="1.2" fill="#5a3518"/><circle cx="15" cy="14" r="1.6" fill="#5a3518"/><circle cx="9.5" cy="15" r="1.2" fill="#5a3518"/></svg><b id="rG">0</b> galletas</span>
      <span title="Fragmentos de mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5l5-2 6 2 5-2v16l-5 2-6-2-5 2z" fill="#e8d6b0"/><path d="M9 3v16M15 5v16" stroke="#a88f62" stroke-width="1.3"/><path d="M6 10l3 1.5 3-2 3 2" stroke="#d6336c" stroke-width="1.4" fill="none" stroke-dasharray="2 1.6"/></svg><b id="rF">0</b> fragmentos</span>
      <span title="Sobres sin abrir"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5" fill="#7e55e0"/><path d="M5 7h14" stroke="#c9b3ff" stroke-width="1.4"/><circle cx="12" cy="14" r="3.2" fill="none" stroke="#e9ddff" stroke-width="1.4"/></svg><b id="rS">0</b> sobres</span>
    </div>
    <div class="seg" role="group" aria-label="Velocidad del tiempo" id="speed">
      <button type="button" data-v="demo">Tiempo rápido</button><button type="button" data-v="real">Tiempo real</button>
    </div>
  </header>
  <p class="demo-note" id="demoNote"></p>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tabMapa" aria-selected="true" aria-controls="vMapa">Mapa</button>
    <button type="button" role="tab" id="tabPers" aria-selected="false" aria-controls="vPers">Personajes y vínculo</button>
  </nav>

  <section id="vMapa" role="tabpanel" aria-labelledby="tabMapa" class="layout">
    <div class="map-card">
      <div class="map" id="map"><svg id="mapSvg" viewBox="0 0 1000 640" aria-hidden="true"></svg><div id="nodes"></div></div>
      <div class="map-legend" id="legend"></div>
    </div>
    <aside class="slots-col" aria-labelledby="slotsH">
      <h2 id="slotsH">Expediciones <small id="slotsCount"></small></h2>
      <div id="slots" class="slots-list"></div>
    </aside>
  </section>

  <section id="vPers" role="tabpanel" aria-labelledby="tabPers" hidden>
    <div class="pgrid" id="pgrid"></div>
  </section>

  <footer class="foot">
    <span>Datos de ejemplo. Tu avance se guarda solo en este navegador.</span>
    <span class="row" id="resetBox"><button class="btn small ghost danger" type="button" id="reset">Reiniciar demo</button></span>
  </footer>
</div>

<dialog id="dPrep" aria-labelledby="prepT"><div class="dlg" id="prepBody"></div></dialog>
<dialog id="dZona" class="small" aria-labelledby="zonaT"><div class="dlg" id="zonaBody"></div></dialog>
<dialog id="dRep" aria-labelledby="repT"><div class="dlg" id="repBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="expediciones-datos.js"></script>
<script src="expediciones-logica.js"></script>
<script>
(function(){
  'use strict';
  var D = window.EXPEDICIONES_DATOS, E = window.Expediciones;
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'wb-expediciones-v1', DEMO = 360; // en modo rápido el tiempo pasa 360 veces más rápido

  var ZONA = {}, PERS = {}, CARTA = {};
  D.zonas.forEach(function(z){ ZONA[z.id] = z; });
  D.personajes.forEach(function(p){ PERS[p.id] = p; });
  D.cartas.forEach(function(c){ CARTA[c.id] = c; });
  var ZONAS_ORD = D.zonas.slice().sort(function(a,b){ return a.orden - b.orden; });
  var DUR = {}; E.DURACIONES.forEach(function(d){ DUR[d.id] = d; });
  var TC = function(t){ return D.terrenos[t].color; };

  /* ---------- estado ---------- */
  function nuevo(){
    var i = D.inicial, v = {};
    D.personajes.forEach(function(p){ v[p.id] = (i.vinculo && i.vinculo[p.id]) || 0; });
    return { v: 1, galletas: i.galletas, fragmentos: i.fragmentos, sobres: i.sobres, zonas: i.zonas.slice(), coleccion: i.coleccion.slice(), vinculo: v, expediciones: [], completadas: 0, demo: true, n: 0 };
  }
  var S;
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
  if (!S || S.v !== 1) S = nuevo();
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

  function espacios(){ return 2 + (S.completadas >= 10 ? 1 : 0) + (S.zonas.indexOf('camara') >= 0 ? 1 : 0); }
  function activas(){ return S.expediciones; }
  function ocupadas(){ var o = {}; activas().forEach(function(x){ x.equipo.forEach(function(m){ o[m.carta] = x; }); }); return o; }
  function lista(x){ return Date.now() >= x.termina; }
  function nivelV(pid){ return E.nivelVinculo(S.vinculo[pid] || 0); }
  function siguienteZona(){ for (var i = 0; i < ZONAS_ORD.length; i++) if (S.zonas.indexOf(ZONAS_ORD[i].id) < 0) return ZONAS_ORD[i]; return null; }

  /* ---------- utilidades ---------- */
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmtT(ms){
    var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return h ? h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0') : m + ':' + String(x).padStart(2,'0');
  }
  function dms(d){ return d.minutos * 60000 / (S.demo ? DEMO : 1); }
  function lstr(names){ return names.length < 2 ? names.join('') : names.slice(0,-1).join(', ') + ' y ' + names[names.length - 1]; }
  function arte(c, extra){
    var p = PERS[c.personaje], cls = 'art' + (c.holo ? ' holo' : '') + (extra ? ' ' + extra : '');
    if (c.arte) return '<span class="' + cls + '"><img src="' + esc(c.arte) + '" alt=""></span>';
    return '<span class="' + cls + ' ph" style="--tc:' + TC(p.terreno) + '"><span>' + esc(p.nombre.charAt(0)) + '</span></span>';
  }
  function avatar(pid){
    var p = PERS[pid], conArte = null;
    S.coleccion.forEach(function(id){ var c = CARTA[id]; if (c && c.personaje === pid && c.arte && !conArte) conArte = c.arte; });
    return '<span class="av" style="--ac:' + TC(p.terreno) + '" title="' + esc(p.nombre) + '">' + (conArte ? '<img src="' + esc(conArte) + '" alt="">' : esc(p.nombre.charAt(0))) + '</span>';
  }
  var ICON = {
    'Ciudad': '<path d="M3 21V10l5-3v14M8 21V4l8 3v14M16 21v-9l5 2v7M2 21h20M11 9h2M11 12h2M11 15h2"/>',
    'Bosque': '<path d="M12 2l6 8h-3.5l4.5 6.5H5L9.5 10H6z M12 16.5V22"/>',
    'Costa': '<path d="M2 16c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 20c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M8 11a4 4 0 0 1 8 0"/>',
    'Ruinas': '<path d="M3 21h18M4 18h16M6 18V9M10 18V9M14 18v-5M18 18V9M3.5 9L12 4l8.5 5z"/>',
    'Montaña': '<path d="M2 20l7.5-13 4 6.5 2.5-3.5L22 20zM7.5 10.5l2 2 2-2"/>',
    'camara': '<path d="M5 21V10a7 7 0 0 1 14 0v11zM9 21v-6a3 3 0 0 1 6 0v6"/><circle cx="12" cy="9" r="1.6"/>'
  };
  function icono(z){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (z.id === 'camara' ? ICON.camara : ICON[z.terreno]) + '</svg>'; }
  var toastT = 0;
  function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 3200); }
  function bump(id){ var el = $(id).parentNode; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  /* ---------- mapa (dibujo fijo) ---------- */
  function dibujarMapa(){
    var seed = 11; function r(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var P = function(z){ return [z.x * 10, z.y * 6.4]; };
    var s = '<defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>' +
      '<radialGradient id="vig" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient>';
    D.zonas.forEach(function(z){ s += '<radialGradient id="g-' + z.id + '"><stop offset="0" stop-color="' + TC(z.terreno) + '" stop-opacity=".30"/><stop offset="1" stop-color="' + TC(z.terreno) + '" stop-opacity="0"/></radialGradient>'; });
    s += '</defs>';
    // mar con olas
    s += '<rect width="1000" height="640" fill="#130d18"/>';
    for (var i = 0; i < 26; i++) { var wx = r() * 1000, wy = r() * 640; s += '<path d="M' + wx.toFixed(0) + ' ' + wy.toFixed(0) + 'q8 -5 16 0t16 0" fill="none" stroke="#2c2036" stroke-width="2" stroke-linecap="round"/>'; }
    // tierra
    var land = 'M70 210C90 120 200 70 320 82C420 40 560 52 650 92C760 48 900 70 942 160C990 250 952 332 902 382C944 452 900 560 790 592C660 630 520 600 420 612C300 632 160 612 100 542C40 472 62 382 50 322C40 272 50 240 70 210Z';
    s += '<path d="' + land + '" fill="#211829" transform="translate(6 10)"/>';
    s += '<path d="' + land + '" fill="#2a1f31" stroke="#4a3852" stroke-width="2.5"/>';
    // cuadrícula de mapa antiguo
    s += '<g stroke="#f7f0f4" stroke-opacity=".035" stroke-width="1">';
    for (var gx = 100; gx < 1000; gx += 100) s += '<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="640"/>';
    for (var gy = 80; gy < 640; gy += 80) s += '<line x1="0" y1="' + gy + '" x2="1000" y2="' + gy + '"/>';
    s += '</g>';
    // regiones
    D.zonas.forEach(function(z){ var p = P(z); s += '<ellipse cx="' + p[0] + '" cy="' + p[1] + '" rx="150" ry="110" fill="url(#g-' + z.id + ')"/>'; });
    // decoración por terreno
    s += '<g opacity=".9">';
    function around(z, n, rx, ry, fn){ var p = P(z); for (var k = 0; k < n; k++) { var a = r() * Math.PI * 2, d = .45 + r() * .55; var x = p[0] + Math.cos(a) * rx * d, y = p[1] + Math.sin(a) * ry * d; if (Math.hypot(x - p[0], y - p[1]) < 44) continue; s += fn(x, y, k); } }
    around(ZONA.bosque, 30, 120, 85, function(x, y){ var h = 12 + r() * 10; return '<path d="M' + x.toFixed(1) + ' ' + (y - h).toFixed(1) + 'l' + (h * .45).toFixed(1) + ' ' + h.toFixed(1) + 'h' + (-h * .9).toFixed(1) + 'z" fill="#2f6b57"/>'; });
    around(ZONA.ciudad, 18, 110, 70, function(x, y){ var w = 8 + r() * 8, h = 10 + r() * 20; return '<rect x="' + (x - w / 2).toFixed(1) + '" y="' + (y - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="#4a2c45"/><rect x="' + (x - 1.5).toFixed(1) + '" y="' + (y - h + 4).toFixed(1) + '" width="3" height="3" fill="#ffd36e" opacity=".8"/>'; });
    around(ZONA.costa, 14, 140, 60, function(x, y){ return '<path d="M' + x.toFixed(0) + ' ' + y.toFixed(0) + 'q6 -5 12 0t12 0" fill="none" stroke="#5cc8e6" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>'; });
    around(ZONA.ruinas, 12, 120, 80, function(x, y){ var h = 10 + r() * 14; return '<rect x="' + (x - 3).toFixed(1) + '" y="' + (y - h).toFixed(1) + '" width="6" height="' + h.toFixed(1) + '" fill="#7a5a3a"/><rect x="' + (x - 5).toFixed(1) + '" y="' + (y - h - 3).toFixed(1) + '" width="10" height="3" fill="#8f6c46"/>'; });
    around(ZONA.montana, 14, 150, 70, function(x, y){ var h = 18 + r() * 22, w = h * .8; return '<path d="M' + (x - w).toFixed(1) + ' ' + y.toFixed(1) + 'L' + x.toFixed(1) + ' ' + (y - h).toFixed(1) + 'L' + (x + w).toFixed(1) + ' ' + y.toFixed(1) + 'z" fill="#3b3a58"/><path d="M' + (x - w * .3).toFixed(1) + ' ' + (y - h * .7).toFixed(1) + 'L' + x.toFixed(1) + ' ' + (y - h).toFixed(1) + 'L' + (x + w * .3).toFixed(1) + ' ' + (y - h * .7).toFixed(1) + 'z" fill="#dfe6ff"/>'; });
    around(ZONA.camara, 10, 90, 60, function(x, y){ return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (1.5 + r() * 2).toFixed(1) + '" fill="#f2cf6e" opacity=".7"/>'; });
    s += '</g>';
    // ruta
    var ord = ZONAS_ORD;
    for (var j = 0; j < ord.length - 1; j++) {
      var a = P(ord[j]), b = P(ord[j + 1]), mx = (a[0] + b[0]) / 2 + (j % 2 ? 40 : -40), my = (a[1] + b[1]) / 2 + (j % 2 ? -30 : 30);
      s += '<path class="route" data-to="' + ord[j + 1].id + '" d="M' + a[0] + ' ' + a[1] + 'Q' + mx + ' ' + my + ' ' + b[0] + ' ' + b[1] + '" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>';
    }
    // niebla
    D.zonas.forEach(function(z){
      var p = P(z), g = '';
      for (var k = 0; k < 7; k++) g += '<circle cx="' + (p[0] + (r() - .5) * 170).toFixed(0) + '" cy="' + (p[1] + (r() - .5) * 110).toFixed(0) + '" r="' + (45 + r() * 45).toFixed(0) + '"/>';
      s += '<g class="fog" data-z="' + z.id + '" filter="url(#blur)" fill="#cdbbd8" opacity=".5"><g>' + g + '</g></g>';
    });
    // rosa de los vientos
    s += '<g transform="translate(935 575)" opacity=".55"><circle r="26" fill="none" stroke="#c9b9c4" stroke-width="1"/><path d="M0 -24L5 0L0 24L-5 0Z" fill="#c9b9c4"/><path d="M-24 0L0 4L24 0L0 -4Z" fill="#6c5d72"/><text y="-31" text-anchor="middle" font-size="12" fill="#c9b9c4" font-family="Space Grotesk,system-ui">N</text></g>';
    s += '<rect width="1000" height="640" fill="url(#vig)"/>';
    $('mapSvg').innerHTML = s;
    $('legend').innerHTML = Object.keys(D.terrenos).map(function(t){ return '<span><i style="--c:' + TC(t) + '"></i>' + t + '</span>'; }).join('') + '<span style="margin-left:auto">Toca una zona para mandar un equipo</span>';
  }

  /* ---------- render ---------- */
  function renderRes(){ $('rG').textContent = S.galletas; $('rF').textContent = S.fragmentos; $('rS').textContent = S.sobres; }
  function renderSpeed(){
    [].forEach.call($('speed').children, function(b){ b.setAttribute('aria-pressed', (b.dataset.v === 'demo') === S.demo ? 'true' : 'false'); });
    $('demoNote').innerHTML = S.demo ? '<b>Tiempo rápido:</b> para probar, 30 min duran 5 s, 2 h duran 20 s y 8 h duran 80 s. En el juego real se usa el tiempo normal.' : 'Tiempo real: las expediciones duran lo que dicen. Cambia a tiempo rápido para probar.';
  }

  function renderNodes(){
    var sig = siguienteZona(), act = activas(), html = '';
    ZONAS_ORD.forEach(function(z){
      var abierta = S.zonas.indexOf(z.id) >= 0, aqui = act.filter(function(x){ return x.zona === z.id; });
      var cls = 'node' + (abierta ? '' : ' locked') + (!abierta && sig && sig.id === z.id ? ' next' : '');
      var small, extra = '', p = 0, listas = 0;
      if (!abierta) small = sig && sig.id === z.id ? 'Niebla · ' + Math.min(S.fragmentos, z.fragmentos) + '/' + z.fragmentos + ' fragmentos' : 'Niebla';
      else if (aqui.length) {
        listas = aqui.filter(lista).length;
        var x = aqui.slice().sort(function(a, b){ return a.termina - b.termina; })[0];
        p = Math.min(1, (Date.now() - x.inicia) / (x.termina - x.inicia));
        small = listas ? (listas > 1 ? listas + ' equipos de vuelta' : 'Equipo de vuelta') : '<span data-t="' + x.id + '">' + fmtT(x.termina - Date.now()) + '</span> · ' + aqui.length + (aqui.length > 1 ? ' equipos' : ' equipo');
        extra = '<span class="ring" data-ring="' + x.id + '" style="--p:' + p.toFixed(3) + '"></span>' + (listas ? '<span class="ready"></span>' : '');
      } else small = z.terreno + ' · dificultad ' + z.dificultad;
      var label = esc(z.nombre) + (abierta ? '' : ', zona con niebla');
      html += '<button type="button" class="' + cls + '" data-z="' + z.id + '" style="left:' + z.x + '%;top:' + z.y + '%;--tc:' + TC(z.terreno) + '" aria-label="' + label + '"><span class="med">' + icono(z) + extra + '</span><span class="lbl"><b>' + esc(z.nombre) + '</b><small>' + small + '</small></span></button>';
    });
    $('nodes').innerHTML = html;
    [].forEach.call(document.querySelectorAll('.fog'), function(f){ f.classList.toggle('off', S.zonas.indexOf(f.dataset.z) >= 0); });
    [].forEach.call(document.querySelectorAll('.route'), function(rt){
      var on = S.zonas.indexOf(rt.dataset.to) >= 0;
      rt.setAttribute('stroke', on ? '#ff8ab0' : '#6c5d72'); rt.setAttribute('opacity', on ? '.75' : '.6');
    });
  }

  var confirmar = null;
  function renderSlots(){
    var n = espacios(), act = activas().slice().sort(function(a, b){ return a.termina - b.termina; }), html = '';
    $('slotsCount').textContent = act.length + ' de ' + n + ' en uso';
    act.forEach(function(x){
      var z = ZONA[x.zona], ok = lista(x), p = Math.min(1, (Date.now() - x.inicia) / (x.termina - x.inicia));
      html += '<div class="slot' + (ok ? ' done' : '') + '" data-x="' + x.id + '">' +
        '<div class="slot-top"><b>' + esc(z.nombre) + '</b><span>' + DUR[x.duracion].etiqueta + ' · ' + esc(E.CALIFICACIONES.filter(function(c){ return c.id === x.calificacion; })[0].nombre) + '</span></div>' +
        '<div class="avs">' + x.equipo.map(function(m){ return avatar(m.personaje); }).join('') + '<span class="names">' + esc(lstr(x.equipo.map(function(m){ return m.nombre; }))) + '</span></div>' +
        '<div class="prog"><i data-bar="' + x.id + '" style="--p:' + p.toFixed(3) + '"></i></div>';
      if (confirmar === x.id) {
        html += '<div class="inline-confirm">Vuelven sin botín ni vínculo.<button class="btn small danger" type="button" data-a="cancel-yes">Sí, cancelar</button><button class="btn small" type="button" data-a="cancel-no">No</button></div>';
      } else {

  /* ---------- preparar expedición ---------- */
  var prep = null;
  function equipoActual(){
    return prep.ids.map(function(id){ var c = CARTA[id], p = PERS[c.personaje]; return { carta: c, personaje: p, nivelVinculo: nivelV(p.id) }; });
  }
  function abrirPrep(zid){
    var ultimo = null; try { ultimo = JSON.parse(localStorage.getItem(KEY + '-dur') || 'null'); } catch(e) {}

  function renderPrep(){

      '<div class="track" style="--cc:var(--' + ({excelente:'gold',bien:'good',normal:'warn',dificil:'bad'})[cal.id] + ');--f:' + f.toFixed(3) + '"><span class="fill"></span>' +
      [.6, 1, 1.4].map(function(k){ return '<span class="tk" style="--x:' + (k / 1.8).toFixed(3) + '"></span>'; }).join('') + '</div>' +
      '<div class="track-lbl"><span style="--x:' + (.3 / 1.8).toFixed(3) + '">Difícil</span><span style="--x:' + (.8 / 1.8).toFixed(3) + '">Normal</span><span style="--x:' + (1.2 / 1.8).toFixed(3) + '">Bien</span><span style="--x:' + (1.6 / 1.8).toFixed(3) + '">Excelente</span></div>' +
      '<div class="syn">' + (ev.sinergias.length ? ev.sinergias.map(function(s){ return '<span>' + esc(s.nombre) + ' +10%</span>'; }).join('') : '<span class="off">Sinergias: 3 roles distintos o un dúo dan +10% cada uno</span>') + '</div></div>';

    }).join('') + '</div>';

    var expect = '<p class="expect">' + (eq.length ? 'Botín esperado: <b>~' + Math.round(esp.galletas) + ' galletas</b> · <b>~' + esp.fragmentos.toFixed(1) + ' fragmentos</b> · <b>' + (esp.sobre * 100).toFixed(1) + '%</b> de sacar un sobre · <b>' + (esp.carta * 100).toFixed(1) + '%</b> de la carta de la zona. Los eventos pueden sumar o quitar.' : 'Elige cartas para ver el botín esperado.') + '</p>';

    var tabla = E.tablaBotin(z, roles, D.botinBase), NOM = { galletas: 'Galletas', fragmento: 'Fragmento de mapa', nada: 'Nada (solo un evento)', sobre: 'Sobre', carta: 'Carta exclusiva: ' + PERS[CARTA[z.carta].personaje].nombre + ' · ' + CARTA[z.carta].rareza };
    var odds = '<details class="odds"' + (prep.odds ? ' open' : '') + '><summary>Probabilidades por tirada en esta zona</summary><table><thead><tr><th>Premio</th><th>Cantidad</th><th style="text-align:right">Probabilidad</th></tr></thead><tbody>' +
      tabla.map(function(e){ return '<tr><td>' + esc(NOM[e.tipo]) + '</td><td>' + (e.tipo === 'galletas' ? e.min + ' a ' + e.max : e.tipo === 'fragmento' ? e.cantidad : e.tipo === 'nada' ? '—' : 1) + '</td><td class="n">' + (e.prob * 100).toFixed(1) + '%</td></tr>'; }).join('') +
      '</tbody></table></details>';

    var why = libres <= 0 ? 'No hay espacios libres. Reclama o cancela una expedición.' : !eq.length ? 'Elige al menos una carta.' : '';
    var send = '<div class="sendrow"><button class="btn primary" type="button" id="send"' + (why ? ' disabled' : '') + '>Enviar · ' + dur.etiqueta + '</button>' + (why ? '<span class="why">' + why + '</span>' : '') + '</div>';

    // selector
    var pers = {}; eq.forEach(function(m){ pers[m.personaje.id] = 1; });
    var cartas = S.coleccion.map(function(id){ return CARTA[id]; }).filter(Boolean).map(function(c){
      var p = PERS[c.personaje], pc = E.poderCarta(c, p, z, nivelV(p.id));
      return { c: c, p: p, poder: pc.poder, en: pc.enTerreno, terr: E.terrenos(c, p), busy: ocu[c.id], sel: prep.ids.indexOf(c.id) >= 0, mismo: !prep.ids.some(function(x){ return x === c.id; }) && pers[p.id] };
    }).filter(function(o){ return prep.filtro === 'todas' || o.terr.indexOf(prep.filtro) >= 0; })
      .sort(function(a, b){ return (a.busy ? 1 : 0) - (b.busy ? 1 : 0) || b.poder - a.poder; });
    var picker = '<div class="picker-h"><h3>Tus cartas</h3><div class="filters" role="group" aria-label="Filtrar por terreno"><button type="button" data-f="todas" aria-pressed="' + (prep.filtro === 'todas') + '">Todas</button>' +
      Object.keys(D.terrenos).map(function(t){ return '<button type="button" data-f="' + t + '" aria-pressed="' + (prep.filtro === t) + '"><i style="--c:' + TC(t) + '"></i>' + t + '</button>'; }).join('') + '</div></div>' +
      '<div class="grid">' + (cartas.length ? cartas.map(function(o){
        var na = o.busy || o.mismo || (!o.sel && prep.ids.length >= 3);
        var nota = o.busy ? 'En ' + esc(ZONA[o.busy.zona].nombre) : o.mismo ? esc(o.p.nombre) + ' ya va en el equipo' : '';
        return '<button type="button" class="ct' + (o.sel ? ' sel' : '') + (na && !o.sel ? ' na' : '') + '" data-c="' + o.c.id + '"' + (na && !o.sel ? ' aria-disabled="true"' : '') + ' aria-pressed="' + o.sel + '">' + arte(o.c) +
          '<span class="rb r-' + o.c.rareza + '">' + o.c.rareza + '</span>' + (o.sel ? '<span class="chk" aria-hidden="true">✓</span>' : '') + (nota ? '<span class="busy">' + nota + '</span>' : '') +
          '<span class="bd"><b>' + esc(o.p.nombre) + '<span class="' + (o.en ? 'on' : '') + '" title="Poder en esta zona">' + Math.round(o.poder) + '</span></b><small>' + esc(o.terr.join(' · ')) + '</small><small>' + esc(o.p.rol) + (o.c.holo ? ' · holo' : '') + (nivelV(o.p.id) > 1 ? ' · vínculo ' + nivelV(o.p.id) : '') + '</small></span></button>';
      }).join('') : '<p class="hint">No tienes cartas de este terreno.</p>') + '</div>';

    $('prepBody').innerHTML = '<div class="dlg-h"><div><p class="eyebrow">Preparar expedición</p><h2 id="prepT">' + esc(z.nombre) + '</h2><p><span class="chip"><i style="--c:' + TC(z.terreno) + '"></i>' + z.terreno + '</span><span>Dificultad ' + z.dificultad + '</span><span>' + libres + (libres === 1 ? ' espacio libre' : ' espacios libres') + '</span></p></div><button class="x" type="button" data-close aria-label="Cerrar">×</button></div>' +
      '<div class="prep"><div style="display:grid;gap:14px;align-content:start;min-width:0"><div class="team">' + team + '</div>' + meter + durs + expect + odds + send + '</div><div style="display:grid;gap:10px;align-content:start;min-width:0">' + picker + '</div></div>';
  }
  $('prepBody').addEventListener('click', function(e){
    var t = e.target;
    if (t.closest('[data-close]')) { $('dPrep').close(); return; }
    var rm = t.closest('[data-rm]'); if (rm) { prep.ids = prep.ids.filter(function(x){ return x !== rm.dataset.rm; }); renderPrep(); return; }
    var c = t.closest('[data-c]');
    if (c) {
      var id = c.dataset.c;
      if (prep.ids.indexOf(id) >= 0) prep.ids = prep.ids.filter(function(x){ return x !== id; });
      else if (c.getAttribute('aria-disabled') !== 'true') prep.ids.push(id);
      renderPrep(); var again = $('prepBody').querySelector('[data-c="' + id + '"]'); if (again) again.focus(); return;
    }
    var f = t.closest('[data-f]'); if (f) { prep.filtro = f.dataset.f; renderPrep(); return; }
    var d = t.closest('[data-dur]'); if (d) { prep.dur = d.dataset.dur; try { localStorage.setItem(KEY + '-dur', JSON.stringify(prep.dur)); } catch(err) {} renderPrep(); return; }

  $('prepBody').addEventListener('toggle', function(e){ if (e.target.classList.contains('odds')) prep.odds = e.target.open; }, true);

  function enviar(){
    var z = ZONA[prep.zona], eq = equipoActual(), ev = E.evaluar(eq, z), d = DUR[prep.dur], now = Date.now();
    if (!eq.length || espacios() - activas().length <= 0) return;
    var x = {
      id: 'x' + (++S.n) + now.toString(36), zona: z.id, duracion: d.id, inicia: now, termina: now + dms(d),
      semilla: E.nuevaSemilla(), poder: Math.round(ev.poder * 10) / 10, calificacion: ev.calificacion.id,
      equipo: eq.map(function(m){ return { carta: m.carta.id, personaje: m.personaje.id, nombre: m.personaje.nombre, rol: m.personaje.rol, duo: m.personaje.duo }; })
    };
    S.expediciones.push(x);
    $('dPrep').close();
    toast(lstr(x.equipo.map(function(m){ return m.nombre; })) + (x.equipo.length > 1 ? ' salieron' : ' salió') + ' a ' + z.nombre + '.');

  /* ---------- zona con niebla ---------- */

      (es ? '<div class="meter"><div class="meter-top"><b>' + Math.min(S.fragmentos, z.fragmentos) + ' <small>de ' + z.fragmentos + ' fragmentos de mapa</small></b></div><div class="track" style="--cc:var(--accent-text);--f:' + Math.min(1, S.fragmentos / z.fragmentos).toFixed(3) + '"><span class="fill"></span></div></div>' +

  /* ---------- reclamar y reporte ---------- */
  function reclamar(xid){
    var x = S.expediciones.filter(function(e){ return e.id === xid; })[0];
    if (!x || !lista(x)) return;
    var res = E.resolver(x, D), b = res.botin, z = ZONA[x.zona];
    var antes = {}; x.equipo.forEach(function(m){ antes[m.personaje] = S.vinculo[m.personaje] || 0; });
    S.galletas += b.galletas; S.fragmentos += b.fragmentos; S.sobres += b.sobres;
    var cartas = b.cartas.map(function(id){
      var tiene = S.coleccion.indexOf(id) >= 0;
      if (tiene) S.galletas += 50; else S.coleccion.push(id);
      return { id: id, nueva: !tiene };
    });
    x.equipo.forEach(function(m){ S.vinculo[m.personaje] = (S.vinculo[m.personaje] || 0) + res.xp; });
    S.completadas += 1;
    S.expediciones = S.expediciones.filter(function(e){ return e.id !== xid; });
    if (S.completadas === 10) setTimeout(function(){ toast('Completaste 10 expediciones: ganaste un tercer espacio.'); }, 600);
    renderTodo(); bump('rG');
    mostrarReporte(x, z, res, antes, cartas);

    }).join('');
    $('repBody').innerHTML = '<div class="rep"><div class="rep-head"><div><p class="eyebrow">Reporte de expedición</p><h2 id="repT" style="margin:0;font:700 21px/1.2 var(--f-head)">' + esc(z.nombre) + ' · ' + DUR[x.duracion].etiqueta + '</h2><div class="avs" style="margin-top:8px">' + x.equipo.map(function(m){ return avatar(m.personaje); }).join('') + '<span class="names">' + esc(lstr(x.equipo.map(function(m){ return m.nombre; }))) + '</span></div></div><span class="calif c-' + cal.id + '">' + cal.nombre + '</span></div>' +
      evs + loot + '<p style="margin:-6px 0 0;font-size:12.5px;color:var(--text3)">' + res.tiradas + (res.tiradas === 1 ? ' tirada' : ' tiradas') + ' de botín' + (b.vacias ? ' · ' + b.vacias + ' sin premio' : '') + '</p>' + rev + bonds +
      '<div class="row" style="justify-content:flex-end"><button class="btn primary" type="button" data-close>Listo</button></div></div>';
    $('dRep').showModal();
    var wait = (i0 * .55 + 1.6) * 1000;
    try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) wait = 50; } catch(e) {}
    setTimeout(function(){ [].forEach.call($('repBody').querySelectorAll('[data-w]'), function(el){ el.style.setProperty('--w', el.dataset.w); }); }, wait);
  }
  $('repBody').addEventListener('click', function(e){
    if (e.target.closest('[data-close]')) { $('dRep').close(); return; }
    var f = e.target.closest('[data-flip]'); if (f) { f.classList.add('on'); f.setAttribute('aria-label', 'Carta revelada'); }
  });

  /* ---------- eventos generales ---------- */
  $('nodes').addEventListener('click', function(e){
    var n = e.target.closest('[data-z]'); if (!n) return;
    var z = n.dataset.z;
    if (S.zonas.indexOf(z) < 0) { abrirZona(z); return; }
    var listas = activas().filter(function(x){ return x.zona === z && lista(x); });
    if (listas.length) { reclamar(listas[0].id); return; }
    abrirPrep(z);
  });
  $('slots').addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var xid = b.closest('[data-x]').dataset.x, a = b.dataset.a;
    if (a === 'claim') reclamar(xid);
    if (a === 'skip') { S.expediciones.forEach(function(x){ if (x.id === xid) x.termina = Date.now(); }); renderTodo(); }
    if (a === 'cancel') { confirmar = xid; renderSlots(); var y = $('slots').querySelector('[data-a="cancel-no"]'); if (y) y.focus(); }
    if (a === 'cancel-no') { confirmar = null; renderSlots(); }
    if (a === 'cancel-yes') { confirmar = null; S.expediciones = S.expediciones.filter(function(x){ return x.id !== xid; }); renderTodo(); toast('Expedición cancelada. Las cartas ya están libres.'); }
  });
  $('speed').addEventListener('click', function(e){ var b = e.target.closest('[data-v]'); if (!b) return; S.demo = b.dataset.v === 'demo'; renderTodo(); });
  ['dPrep', 'dZona', 'dRep'].forEach(function(id){ $(id).addEventListener('click', function(e){ if (e.target === e.currentTarget) e.currentTarget.close(); }); });
  function tab(cual){
    var m = cual === 'mapa';
    $('tabMapa').setAttribute('aria-selected', m); $('tabPers').setAttribute('aria-selected', !m);
    $('vMapa').hidden = !m; $('vPers').hidden = m; if (!m) renderPers();
  }
  $('tabMapa').addEventListener('click', function(){ tab('mapa'); });
  $('tabPers').addEventListener('click', function(){ tab('pers'); });
  $('resetBox').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'reset') $('resetBox').innerHTML = '<span>Se borra todo tu avance.</span><button class="btn small danger" type="button" id="resetYes">Sí, reiniciar</button><button class="btn small" type="button" id="resetNo">No</button>';
    if (b.id === 'resetYes') { S = nuevo(); renderTodo(); toast('Demo reiniciada.'); }
    if (b.id === 'resetYes' || b.id === 'resetNo') $('resetBox').innerHTML = '<button class="btn small ghost danger" type="button" id="reset">Reiniciar demo</button>';
  });

  /* ---------- reloj ---------- */
  var avisadas = {};
  activas().forEach(function(x){ if (lista(x)) avisadas[x.id] = 1; });
  setInterval(function(){
    var now = Date.now(), cambio = false;
    activas().forEach(function(x){
      var ok = now >= x.termina, p = Math.min(1, (now - x.inicia) / (x.termina - x.inicia));
      [].forEach.call(document.querySelectorAll('[data-t="' + x.id + '"]'), function(el){ if (!ok) el.textContent = fmtT(x.termina - now); });
      var bar = document.querySelector('[data-bar="' + x.id + '"]'); if (bar) bar.style.setProperty('--p', p.toFixed(3));
      var ring = document.querySelector('[data-ring="' + x.id + '"]'); if (ring) ring.style.setProperty('--p', p.toFixed(3));
      if (ok && !avisadas[x.id]) { avisadas[x.id] = 1; cambio = true; toast('¡Un equipo volvió de ' + ZONA[x.zona].nombre + '!'); }
    });
    if (cambio) { renderNodes(); renderSlots(); if ($('dPrep').open) renderPrep(); }
  }, 250);

  dibujarMapa();
  renderTodo();
})();
</script>

</body>
</html>
